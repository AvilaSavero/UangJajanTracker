name: uang_jajan_tracker
description: Aplikasi Uang Jajan Tracker built with Flutter
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  http: ^1.6.0
  shared_preferences: ^2.1.1
  intl: ^0.20.2
  provider: ^6.0.5
  fl_chart: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/custom_icons/
    - assets/images/foto/
